[project]
name = "image-classifier-project"
version = "0.1.0"
description = "Image Classifier Project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "dash-bootstrap-components>=2.0.4",
    "dash>=3.3.0",
    "ipykernel>=7.1.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/image_classifier_project"
Repository = "https://github.com/simonerigoni/image_classifier_project"
Website = "https://www.simonerigoni.net/blog/do-you-know-this-flower-image-classifier-using-pytorch"
Medium = "https://medium.com/data-science/do-you-know-this-flower-image-classifier-using-pytorch-1d45c3a3df1c"
Blogspot = "https://simonerigoni01.blogspot.com/2027/02/conosci-questo-fiore-classificatore-di.html"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"